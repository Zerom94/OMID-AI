<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OMID AI - Cyberpunk Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #667eea;
            --secondary: #764ba2;
            --bg-dark: #0a0e27;
            --bg-card: rgba(255, 255, 255, 0.05);
            --border: rgba(255, 255, 255, 0.1);
            --text-primary: #ffffff;
            --text-secondary: #a0aec0;
            --accent-glow: rgba(255, 0, 255, 0.3);
            --success: #00ff88;
            --warning: #ffaa00;
            --error: #ff4444;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Vazirmatn', sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            background-image:
                radial-gradient(circle at 20% 50%, rgba(102, 126, 234, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(118, 75, 162, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 40% 80%, rgba(255, 0, 255, 0.05) 0%, transparent 50%);
            overflow-x: hidden;
        }
        .glassmorphism {
            background: var(--bg-card);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--border);
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        .cyberpunk-text {
            text-shadow: 0 0 10px var(--accent-glow), 0 0 20px var(--accent-glow);
        }
        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
        header { text-align: center; padding: 30px 0; margin-bottom: 30px; }
        header h1 {
            font-size: 3rem;
            font-weight: 700;
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }
        .agent-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .agent-card { padding: 20px; text-align: center; transition: all 0.3s ease; cursor: pointer; }
        .agent-card:hover { transform: translateY(-5px); box-shadow: 0 10px 25px rgba(255, 255, 255, 0.1); }
        .agent-icon { font-size: 2.5rem; margin-bottom: 10px; }
        .agent-name { font-size: 1.2rem; font-weight: 600; margin-bottom: 8px; color: var(--accent-color); }
        .agent-desc { font-size: 0.9rem; color: var(--text-secondary); line-height: 1.5; }
        .chat-container { display: grid; grid-template-columns: 1fr 300px; gap: 20px; margin-bottom: 30px; }
        .chat-panel { padding: 20px; border-radius: 15px; display: flex; flex-direction: column; }
        .chat-messages { flex: 1; overflow-y: auto; padding: 15px; border-radius: 10px; border: 1px solid var(--border); font-size: 0.95rem; line-height: 1.6; max-height: 500px; }
        .message { margin-bottom: 15px; padding: 10px 15px; border-radius: 10px; max-width: 80%; }
        .user-message { background: rgba(255, 255, 255, 0.1); border-left: 3px solid var(--accent-color); margin-left: auto; }
        .assistant-message { background: rgba(255, 255, 255, 0.1); border-right: 3px solid #00ff88; }
        .chat-input { display: flex; gap: 10px; margin-top: 15px; }
        .chat-input input { flex: 1; padding: 15px; background: rgba(0, 0, 0, 0.3); border: 1px solid var(--border); border-radius: 10px; color: var(--text-primary); font-family: 'Vazirmatn', sans-serif; font-size: 1rem; }
        .chat-input input:focus { outline: none; border-color: var(--accent-color); box-shadow: 0 0 10px var(--accent-glow); }
        .btn { padding: 15px 25px; background: linear-gradient(45deg, var(--primary), var(--secondary)); border: none; border-radius: 10px; color: white; font-family: 'Vazirmatn', sans-serif; font-weight: 600; cursor: pointer; transition: all 0.3s ease; }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 5px 15px var(--accent-glow); }
        .sidebar { display: flex; flex-direction: column; gap: 20px; }
        .status-panel, .log-panel { padding: 20px; }
        .panel-title { font-size: 1.2rem; margin-bottom: 15px; color: var(--accent-color); border-bottom: 1px solid var(--border); padding-bottom: 10px; }
        .status-item { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 0.9rem; }
        .status-agent { color: var(--text-secondary); }
        .status-value { font-weight: 600; }
        .status-idle { color: var(--text-secondary); }
        .status-working { color: var(--warning); }
        .status-complete { color: var(--success); }
        .status-fail { color: var(--error); }
        .log-container { max-height: 300px; overflow-y: auto; font-family: monospace; font-size: 0.8rem; background: rgba(0, 0, 0, 0.3); padding: 10px; border-radius: 5px; }
        .log-entry { margin-bottom: 5px; padding: 5px 0; border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
        .log-time { color: var(--text-secondary); margin-right: 10px; }
        .projects-section, .scans-section { margin-top: 30px; }
        .section-title { font-size: 1.5rem; margin-bottom: 20px; color: var(--accent-color); }
        .project-card, .scan-card { padding: 15px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
        .project-info, .scan-info { flex: 1; }
        .project-name, .scan-target { font-weight: 600; margin-bottom: 5px; }
        .project-path, .scan-details { font-size: 0.85rem; color: var(--text-secondary); }
        .actions { display: flex; gap: 10px; }
        .btn-small { padding: 8px 15px; font-size: 0.85rem; }
        .code-explorer { margin-top: 30px; }
        .code-viewer { background: rgba(0, 0, 0, 0.5); border: 1px solid var(--border); border-radius: 10px; padding: 15px; max-height: 400px; overflow-y: auto; font-family: monospace; font-size: 0.9rem; white-space: pre-wrap; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.3); border-radius: 5px; }
        ::-webkit-scrollbar-thumb { background: var(--accent-color); border-radius: 5px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent-glow); }
        @media (max-width: 1024px) { .chat-container { grid-template-columns: 1fr; } .sidebar { flex-direction: row; flex-wrap: wrap; } .status-panel, .log-panel { flex: 1; min-width: 300px; } }
        @media (max-width: 768px) { header h1 { font-size: 2.5rem; } .agent-grid { grid-template-columns: 1fr; } .container { padding: 10px; } }
        @keyframes glow { 0% { box-shadow: 0 0 5px var(--accent-glow); } 50% { box-shadow: 0 0 20px var(--accent-glow), 100% { box-shadow: 0 0 5px var(--accent-glow); } } }
        .active { animation: glow 2s infinite; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1 class="cyberpunk-text">OMID AI</h1>
            <p>سیستم خودمختار هوش مصنوعی پیشرفته</p>
        </header>

        <div class="agent-grid" id="agentGrid"></div>

        <div class="chat-container">
            <div class="chat-panel glassmorphism">
                <div class="chat-messages" id="chatMessages">
                    <div class="message assistant-message">سلام! من دستیار هوشمند OMID AI هستم. چطور می‌توانم کمکتان کنم؟</div>
                </div>
                <div class="chat-input">
                    <input type="text" id="messageInput" placeholder="پیام خود را وارد کنید..." autocomplete="off">
                    <button class="btn" id="sendButton">ارسال</button>
                </div>
            </div>

            <div class="sidebar">
                <div class="status-panel glassmorphism">
                    <h3 class="panel-title">وضعیت ایجنت‌ها</h3>
                    <div id="statusList"></div>
                </div>
                <div class="log-panel glassmorphism">
                    <h3 class="panel-title">لاگ‌های سیستم</h3>
                    <div class="log-container" id="logContainer"></div>
                </div>
            </div>
        </div>

        <div class="projects-section glassmorphism">
            <h2 class="section-title">پروژه‌های تولید شده</h2>
            <div id="projectsList"></div>
        </div>

        <div class="security-scans-section glassmorphism">
            <h2 class="section-title">اسکن‌های امنیتی</h2>
            <div id="scansList"></div>
        </div>

        <div class="code-explorer glassmorphism">
            <h2 class="section-title">مرورگر کد</h2>
            <div id="codeContent" class="code-viewer">محتوای کد اینجا نمایش داده می‌شود...</div>
            <div class="actions" style="margin-top: 15px;">
                <button class="btn btn-small" id="copyCodeButton">کپی</button>
                <button class="btn btn-small" id="zipCodeButton">دانلود ZIP</button>
            </div>
        </div>
    </div>

    <script>
        class OMIDAI {
            constructor() {
                this.agents = [
                    { id: 'chat', name: 'دستیار', icon: '💬', desc: 'گفتگو و پاسخگویی' },
                    { id: 'developer', name: 'توسعه‌دهنده', icon: '💻', desc: 'تولید کد پایتون' },
                    { id: 'security', name: 'امنیت', icon: '🛡️', desc: 'اسکن و تست نفوذ' },
                    { id: 'research', name: 'محقق', icon: '🔍', desc: 'جستجو و اطلاعات' },
                    { id: 'content', name: 'محتوا', icon: '✍️', desc: 'تولید متن' },
                    { id: 'recon', name: 'اطلاعات', icon: '📡', desc: 'Reconnaissance' }
                ];
                this.init();
            }

            init() {
                this.renderAgentGrid();
                this.setupEventListeners();
                this.loadInitialData();
            }

            renderAgentGrid() {
                const grid = document.getElementById('agentGrid');
                grid.innerHTML = '';
                this.agents.forEach(agent => {
                    const card = document.createElement('div');
                    card.className = 'agent-card glassmorphism';
                    card.innerHTML = `
                        <div class="agent-icon">${agent.icon}</div>
                        <div class="agent-name">${agent.name}</div>
                        <div class="agent-desc">${agent.desc}</div>
                    `;
                    grid.appendChild(card);
                });
            }

            setupEventListeners() {
                const sendButton = document.getElementById('sendButton');
                const messageInput = document.getElementById('messageInput');
                sendButton.onclick = () => this.sendMessage();
                messageInput.onkeypress = (e) => { if (e.key === 'Enter') this.sendMessage(); };
            }

            async sendMessage() {
                const input = document.getElementById('messageInput');
                const message = input.value.trim();
                if (!message) return;
                this.addMessage(message, 'user');
                input.value = '';
                try {
                    const response = await fetch('/api/chat', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ message })
                    });
                    const data = await response.json();
                    this.addMessage(data.response, 'assistant');
                } catch (error) {
                    this.addMessage('❌ خطا در ارتباط با سرور', 'assistant');
                }
            }

            addMessage(text, type) {
                const container = document.getElementById('chatMessages');
                const messageDiv = document.createElement('div');
                messageDiv.className = `message ${type}-message`;
                messageDiv.textContent = text;
                container.appendChild(messageDiv);
                container.scrollTop = container.scrollHeight;
            }

            async loadInitialData() {
                await this.loadProjects();
                await this.loadSecurityScans();
            }

            async loadProjects() {
                try {
                    const response = await fetch('/api/projects');
                    const data = await response.json();
                    this.renderProjects(data.projects);
                } catch (error) {}
            }

            renderProjects(projects) {
                const container = document.getElementById('projectsList');
                container.innerHTML = '';
                if (!projects || projects.length === 0) {
                    container.innerHTML = '<div style="color: var(--text-secondary);">هیچ پروژه‌ای یافت نشد</div>';
                    return;
                }
                projects.forEach(project => {
                    const card = document.createElement('div');
                    card.className = 'project-card glassmorphism';
                    card.innerHTML = `
                        <div class="project-info">
                            <div class="project-name">${project.name}</div>
                            <div class="project-path">${project.path}</div>
                        </div>
                        <div class="actions">
                            <button class="btn btn-small">مشاهده کد</button>
                            <button class="btn btn-small">دانلود</button>
                        </div>
                    `;
                    container.appendChild(card);
                });
            }

            async loadSecurityScans() {
                try {
                    const response = await fetch('/api/security-scans');
                    const data = await response.json();
                    this.renderScans(data.scans);
                } catch (error) {}
            }

            renderScans(scans) {
                const container = document.getElementById('scansList');
                container.innerHTML = '';
                if (!scans || scans.length === 0) {
                    container.innerHTML = '<div style="color: var(--text-secondary);">هیچ اسکنی یافت نشد</div>';
                    return;
                }
                scans.forEach(scan => {
                    const card = document.createElement('div');
                    card.className = 'scan-card glassmorphism';
                    card.innerHTML = `
                        <div class="scan-info">
                            <div class="scan-target">هدف: ${scan.target}</div>
                            <div class="scan-details">تاریخ: ${scan.created_at}</div>
                        </div>
                        <div class="actions">
                            <button class="btn btn-small">مشاهده گزارش</button>
                        </div>
                    `;
                    container.appendChild(card);
                });
            }

            connectSSE() {
                const eventSource = new EventSource('/api/logs');
                eventSource.onmessage = (event) => {
                    const data = JSON.parse(event.data);
                    if (data.type === 'log') {
                        this.addLog(data.data);
                    }
                };
            }

            addLog(logData) {
                const container = document.getElementById('logContainer');
                const logDiv = document.createElement('div');
                logDiv.className = 'log-entry';
                const timestamp = new Date().toLocaleTimeString('fa-IR');
                logDiv.innerHTML = `<span class="log-time">[${timestamp}]</span> ${logData}`;
                container.appendChild(logDiv);
                container.scrollTop = container.scrollHeight;
                while (container.children.length > 50) {
                    container.removeChild(container.firstChild);
                }
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            new OMIDAI();
        });
    </script>
</body>
</html>
